# Configuration Netlify pour La Centrale Des Affaires
# Ce fichier doit être à la racine de ton projet

[build]
  # Dossier contenant tes fichiers HTML (racine = ".")
  publish = "."
  # Dossier des fonctions serveur
  functions = "netlify/functions"

# Redirections pour les pages d'erreur
[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 404

# En-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache pour les assets statiques
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
